name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version // empty')
          CURR_VERSION=$(jq -r '.version' package.json)
          echo "Previous version: $PREV_VERSION"
          echo "Current version:  $CURR_VERSION"

          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "Version changed from $PREV_VERSION to $CURR_VERSION. Proceeding with release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version did not change. Skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22.x
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        if: steps.check_version.outputs.changed == 'true'
        run: npm ci

      - name: Compile extension
        if: steps.check_version.outputs.changed == 'true'
        run: npm run compile

      - name: Publish to VS Code Marketplace
        if: steps.check_version.outputs.changed == 'true'
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
