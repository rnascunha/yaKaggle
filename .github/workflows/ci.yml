name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test:unit

      # Run packaging validation once on Linux to save runner time
      - name: Validate VS Code Extension Package
        if: runner.os == 'Linux'
        run: npx @vscode/vsce package --no-git-tag-version --no-update-package-json

      # Run integration suite with headless display on Linux
      - name: Run VS Code Integration Tests (Linux)
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm test

      - name: Run VS Code Integration Tests (macOS & Windows)
        if: runner.os != 'Linux'
        run: npm test

  # Downstream release triggered ONLY after all matrix tests pass on main
  release:
    name: Trigger Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    secrets: inherit
