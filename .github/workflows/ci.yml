name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test:unit

      # Integration Tests with VS Code Test Runner:
      # Linux requires a virtual display buffer (Xvfb) to run Chromium/Electron headlessly.
      - name: Run VS Code Integration Tests (Linux)
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm test

      - name: Run VS Code Integration Tests (macOS & Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Validate VS Code Extension Package
        run: npx @vscode/vsce package --no-git-tag-version --no-update-package-json
